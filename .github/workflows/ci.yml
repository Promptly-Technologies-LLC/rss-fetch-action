name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"
      - feed-extractor-version

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Github Action with JSON
        uses: ./
        with:
          feed_url: "https://feed.zazzle.com/store/promptlytechnologies/rss"
          file_path: "./feed.json"
          parser_options: "{\"useISODateFormat\": false, \"normalization\": false}"

      - name: Validate JSON
        run: |
          node -e "
          const fs = require('fs');
          const data = fs.readFileSync('./feed.json', 'utf8');
          const obj = JSON.parse(data);
          // With normalization disabled, a single RSS <item> is an object;
          // multiple items are an array.
          const items = Array.isArray(obj.item)
            ? obj.item
            : obj.item
              ? [obj.item]
              : [];
          if (!obj ||
              !obj.title ||
              !obj.link ||
              !obj.language ||
              !obj.pubDate ||
              items.length === 0) {
            console.error('Invalid object', {
              keys: obj && Object.keys(obj),
              itemType: obj && typeof obj.item,
              itemCount: items.length
            });
            process.exit(1);
          }
          "
      
